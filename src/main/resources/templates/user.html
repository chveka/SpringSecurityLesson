<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">OAuth2 Demo</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/user">Profile</a>
            <a class="nav-link" th:if="${role == 'SUPER_ADMIN'}" href="/admin">Admin Panel</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h3>User Profile</h3>
                </div>
                <div class="card-body">
                    <table class="table">
                        <tr>
                            <th>ID:</th>
                            <td th:text="${id}"></td>
                        </tr>
                        <tr>
                            <th>Name:</th>
                            <td th:text="${name}"></td>
                        </tr>
                        <tr>
                            <th>Login:</th>
                            <td th:text="${login}"></td>
                        </tr>
                        <tr>
                            <th>Email:</th>
                            <td th:text="${email}"></td>
                        </tr>
                        <tr>
                            <th>Role:</th>
                            <td>
                                    <span class="badge"
                                          th:classappend="${role == 'SUPER_ADMIN' ? 'bg-danger' : 'bg-primary'}"
                                          th:text="${role}"></span>
                            </td>
                        </tr>
                    </table>

                    <h4 class="mt-4">All Attributes:</h4>
                    <pre th:text="${attributes}"></pre>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
