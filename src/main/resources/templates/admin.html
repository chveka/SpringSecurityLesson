<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">OAuth2 Demo</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/user">Profile</a>
            <a class="nav-link active" href="/admin">Admin Panel</a>
            <a class="nav-link" href="/logout">Logout</a>
        </div>
    </div>
</nav>

<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header bg-danger text-white">
                    <h3>Admin Panel</h3>
                </div>
                <div class="card-body">
                    <h4>User Management</h4>
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Provider</th>
                            <th>Role</th>
                            <th>Last Login</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.name}"></td>
                            <td th:text="${user.email}"></td>
                            <td th:text="${user.provider}"></td>
                            <td th:text="${user.role}"></td>
                            <td th:text="${user.lastLoginDate}"></td>
                        </tr>
                        </tbody>
                    </table>

                    <div class="mt-4">
                        <a href="/admin/dashboard" class="btn btn-primary">Dashboard</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
